services:
  - type: web
    name: vlearnnote-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/transcript-files
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VLEARNNOTE_MODEL
        value: gpt-4o-mini
      - key: VLEARNNOTE_TIMEOUT_SECONDS
        value: "20"
