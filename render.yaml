services:
  - type: web
    name: vlearnnote
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/transcript-files
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VLEARNNOTE_MODEL
        value: gpt-4o-mini
      - key: VLEARNNOTE_TIMEOUT_SECONDS
        value: "20"
